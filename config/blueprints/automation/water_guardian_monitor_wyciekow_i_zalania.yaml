blueprint:
  name: Water Guardian – monitor wycieków i zalania
  description: >
    Monitoruje zużycie wody, wykrywa podejrzenie wycieku i zalania.
    Uwzględnia regenerację zmiękczacza z tolerancją ±25 L/h.
  domain: automation
  input:
    water_sensor:
      name: Sensor wody
      description: Wskaźnik zużycia wody
      selector:
        entity:
          domain: sensor
    water_unit:
      name: Jednostka sensora
      description: Litry czy m³
      selector:
        select:
          options:
            - L
            - m3
    notify_devices:
      name: Urządzenia powiadomień
      description: Lista urządzeń mobilnych do powiadomień (opcjonalne)
      default: []
      selector:
        target:
          entity:
            domain: mobile_app
    flood_sensors:
      name: Czujniki zalania
      description: Wybierz czujniki zalania, które mają wywoływać powiadomienia
      default: []
      selector:
        target:
          entity:
            domain: binary_sensor
    soften_enabled:
      name: Uwzględnij zmiękczacz
      description: Czy uwzględniać regenerację złoża zmiękczacza
      default: false
      selector:
        boolean: {}
    soften_start:
      name: Początek regeneracji zmiękczacza
      description: Godzina początkowa
      default: "02:00"
      selector:
        time: {}
    soften_end:
      name: Koniec regeneracji zmiękczacza
      description: Godzina końcowa
      default: "05:00"
      selector:
        time: {}
    soften_avg_flow:
      name: Średni pobór wody dla regeneracji zmiękczacza
      description: Średni pobór w litrach podczas regeneracji złoża zmiękczacza
      default: 50
      selector:
        number:
          min: 0
          max: 200
          step: 1
          unit_of_measurement: "L"

trigger:
  - platform: time_pattern
    minutes: "/5"

action:
  - variables:
      water: "{{ states(input.water_sensor) | float }}"
      unit: "{{ input.water_unit }}"
      soften: "{{ input.soften_enabled }}"
      start: "{{ input.soften_start }}"
      end: "{{ input.soften_end }}"
      avg_flow: "{{ input.soften_avg_flow }}"
      devices: "{{ input.notify_devices }}"
      floods: "{{ input.flood_sensors }}"

  # Regeneracja zmiękczacza
  - choose:
      - conditions:
          - "{{ soften and (now().strftime('%H:%M') >= start) and (now().strftime('%H:%M') <= end) }}"
        sequence:
          - variables:
              soften_lower: "{{ avg_flow - 25 }}"
              soften_upper: "{{ avg_flow + 25 }}"
          - choose:
              - conditions: "{{ water < soften_lower or water > soften_upper }}"
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.nocny_wyciek_podejrzenie
                  - choose:
                      - conditions: "{{ devices | length > 0 }}"
                        sequence:
                          - service: notify.mobile_app
                            data:
                              target: "{{ devices }}"
                              message: "Nieoczekiwany pobór podczas regeneracji: {{ water }} {{ unit }} (norma {{ avg_flow }} ±25L)"
              - choose:
                  - conditions: "{{ devices | length > 0 }}"
                    sequence:
                      - service: notify.mobile_app
                        data:
                          target: "{{ devices }}"
                          message: "Prawdopodobna regeneracja zmiękczacza: pobór w normie {{ water }} {{ unit }}"

  # Standardowy wyciek
  - choose:
      - conditions: "{{ water > 10 }}" # próg wycieku L/h
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id:
                - input_boolean.dzienny_wyciek_podejrzenie
                - input_boolean.nocny_wyciek_podejrzenie
          - choose:
              - conditions: "{{ devices | length > 0 }}"
                sequence:
                  - service: notify.mobile_app
                    data:
                      target: "{{ devices }}"
                      message: "Podejrzenie wycieku: pobór wody {{ water }} {{ unit }}"

  # Czujniki zalania
  - choose:
      - conditions: "{{ floods | length > 0 }}"
        sequence:
          - repeat:
              count: "{{ floods | length }}"
              sequence:
                - variables:
                    flood_sensor: "{{ floods[repeat.index0] }}"
                - choose:
                    - conditions: "{{ is_state(flood_sensor, 'on') }}"
                      sequence:
                        - service: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.nocny_wyciek_podejrzenie
                        - choose:
                            - conditions: "{{ devices | length > 0 }}"
                              sequence:
                                - service: notify.mobile_app
                                  data:
                                    target: "{{ devices }}"
                                    message: "Czujnik zalania {{ flood_sensor }} wykrył wodę!"

