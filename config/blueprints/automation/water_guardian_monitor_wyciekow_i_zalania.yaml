blueprint:
  name: water_guardian_monitor_wyciekow_i_zalania
  description: >
    Monitor wycieków i zalania.
    - Wykrywa zalanie NATYCHMIAST (czujniki binary_sensor)
    - Monitoruje stały pobór wody (L/h)
    - Porównuje z uczącą się średnią godzinową (14 dni)
    - Obsługuje regenerację zmiękczacza
    - Jedno urządzenie mobilne (stabilna wersja)
  domain: automation

  input:
    water_sensor:
      name: Sensor przepływu (L/min – statistics)
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h ponad średnią)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie mobilne (powiadomienia)
      selector:
        device:
          integration: mobile_app

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Start regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_avg_liters:
      name: Pobór regeneracji (L/h)
      default: 50
      selector:
        number:
          min: 10
          max: 300
          step: 1
          unit_of_measurement: "L/h"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  # INPUTY (YAML, nie template!)
  water_sensor_entity: !input water_sensor
  notify_device_id: !input notify_device
  leak_threshold: !input leak_threshold_lph
  flood_sensors_list: !input flood_sensors

  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_avg_liters: !input soften_avg_liters

  # CZAS
  current_hour: "{{ now().hour }}"
  now_time: "{{ now().strftime('%H:%M') }}"

  # WODA
  water_l_min_mean: "{{ state_attr(water_sensor_entity, 'mean') | float(0) }}"
  water_lph: "{{ water_l_min_mean * 60 }}"
  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"

  # ZMIĘKCZACZ
  soften_min: "{{ soften_avg_liters - 20 }}"
  soften_max: "{{ soften_avg_liters + 20 }}"
  in_soften_window: "{{ soften_enabled and soften_start <= now_time <= soften_end }}"

  # COOLDOWN ZALANIA (30 min)
  last_flood_alert: "{{ states('input_datetime.water_guardian_last_flood_alert') }}"
  flood_cooldown_ok: >
    {{ last_flood_alert in ['unknown','unavailable']
       or (now() - strptime(last_flood_alert, '%Y-%m-%d %H:%M:%S')).total_seconds() > 1800 }}

action:

  ##################################################
  # 🚨 ZALANIE – NAJWYŻSZY PRIORYTET
  ##################################################
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ flood_sensors_list | length > 0 and
                 flood_sensors_list | select('is_state','on') | list | length > 0 and
                 flood_cooldown_ok }}
        sequence:
          - service: notify.mobile_app
            data:
              device_id: "{{ notify_device_id }}"
              title: "🚨🚨 ZALANIE – NATYCHMIAST!"
              message: >
                Wykryto ZALANIE!

                Aktywne czujniki:
                {% for s in flood_sensors_list if is_state(s, 'on') %}
                • {{ state_attr(s,'friendly_name') or s }}
                {% endfor %}

              data:
                ttl: 0
                priority: high
                channel: alarm_stream

          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.water_guardian_last_flood_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  ##################################################
  # 🚨 WYCIEK WODY
  ##################################################
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ water_lph > avg_hourly + leak_threshold }}"
        sequence:

          - choose:
              # ZMIĘKCZACZ
              - conditions:
                  - condition: template
                    value_template: "{{ in_soften_window and soften_min <= water_lph <= soften_max }}"
                sequence:
                  - service: notify.mobile_app
                    data:
                      device_id: "{{ notify_device_id }}"
                      title: "🚿 Regeneracja zmiękczacza"
                      message: >
                        Pobór {{ water_lph | round(1) }} L/h
                        odpowiada regeneracji zmiękczacza.

            default:
              - service: notify.mobile_app
                data:
                  device_id: "{{ notify_device_id }}"
                  title: "⚠️ PODEJRZENIE WYCIEKU WODY"
                  message: >
                    Pobór {{ water_lph | round(1) }} L/h
                    przekracza średnią {{ avg_hourly | round(1) }} L/h.

  ##################################################
  # 🧠 UCZENIE ŚREDNIEJ GODZINOWEJ (14 dni)
  ##################################################
  - service: input_number.set_value
    target:
      entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
    data:
      value: "{{ ((avg_hourly * 13) + water_lph) / 14 }}"

