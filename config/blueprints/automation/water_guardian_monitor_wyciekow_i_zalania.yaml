blueprint:
  name: Water Guardian – detektor wycieków i zalania v2.1
  description: >
    Detekcja wycieków oparta wyłącznie o utility_meter (bez meanów).
    Wykrywa ciągły pobór wody, ignoruje krótkie użycia.
    Obsługuje zmiękczacz, zalanie oraz EMA godzinową (14 dni).
  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_l:
      name: Minimalna suma wycieku (L)
      default: 30
      selector:
        number:
          min: 5
          max: 500
          step: 1
          unit_of_measurement: "L"

    leak_minutes_required:
      name: Minuty ciągłego poboru
      default: 20
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: "min"

    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie do powiadomień
      selector:
        device:
          integration: mobile_app

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Start regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "04:00"
      selector:
        time: {}

    leak_action:
      name: Automatyzacja przy wycieku
      default: []
      selector:
        action: {}

    flood_action:
      name: Automatyzacja przy zalaniu
      default: []
      selector:
        action: {}

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_l: !input leak_threshold_l
  leak_minutes_required: !input leak_minutes_required
  flood_sensors: !input flood_sensors
  notify_device: !input notify_device
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  leak_action: !input leak_action
  flood_action: !input flood_action

  now_time: "{{ now().strftime('%H:%M') }}"
  in_soften_window: >
    {{ soften_enabled and soften_start <= now_time <= soften_end }}

  raw_hour: "{{ states(water_hour_meter) | float(0) }}"
  unit: "{{ state_attr(water_hour_meter, 'unit_of_measurement') | lower }}"
  hour_l: >
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw_hour * 1000) | round(1) }}
    {% else %}
      {{ raw_hour | round(1) }}
    {% endif %}

  last_hour_l: "{{ states('input_number.wg_last_hour') | float(0) }}"
  delta_l: "{{ (hour_l - last_hour_l) | round(1) }}"

action:

  # ===== ZALANIE =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: !input flood_action
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: >
              Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') }}
          - stop

  # ===== CIĄGŁOŚĆ POBORU =====
  - choose:
      - conditions: "{{ delta_l > 0 and not in_soften_window }}"
        sequence:
          - service: input_number.increment
            target:
              entity_id: input_number.wg_minute_streak
      - default:
          - service: input_number.set_value
            target:
              entity_id: input_number.wg_minute_streak
            data:
              value: 0

  # ===== ALARM WYCIEKU =====
  - choose:
      - conditions: >
          {{ states('input_number.wg_minute_streak') | int >= leak_minutes_required
             and hour_l >= leak_threshold_l }}
        sequence:
          - service: input_number.increment
            target:
              entity_id: input_number.wg_leak_streak
      - default:
          - service: input_number.set_value
            target:
              entity_id: input_number.wg_leak_streak
            data:
              value: 0

  - choose:
      - conditions: "{{ states('input_number.wg_leak_streak') | int >= 3 }}"
        sequence:
          - choose:
              - conditions: "{{ leak_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: !input leak_action
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: >
              Wykryto ciągły pobór {{ hour_l }} L przez
              {{ states('input_number.wg_minute_streak') }} min.
          - service: input_number.set_value
            target:
              entity_id: input_number.wg_leak_streak
            data:
              value: 0

  # ===== ZAPAMIĘTAJ STAN =====
  - service: input_number.set_value
    target:
      entity_id: input_number.wg_last_hour
    data:
      value: "{{ hour_l }}"

