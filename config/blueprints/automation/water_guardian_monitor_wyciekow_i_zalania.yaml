blueprint:
  name: Water Guardian – inteligentny monitoring wycieków (15-min średnia)
  description: >
    Monitoruje chwilowy pobór wody na podstawie 15-minutowej średniej (statistics),
    porównuje z 14-dniową średnią godzinową i wysyła powiadomienia.
    Obsługuje opcjonalne czujniki zalania i zmiękczacz wody.
  domain: automation

  input:
    water_sensor:
      name: Sensor przepływu (L/min, statistics 15-min)
      description: Sensor, który mierzy średni pobór wody w L/min
      selector:
        entity:
          domain: sensor

    water_unit:
      name: Jednostka sensora
      default: L
      selector:
        select:
          options:
            - label: "litry"
              value: l
            - label: "m³"
              value: m3

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      description: Lista czujników zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie mobilne do powiadomień
      description: Wybierz urządzenie z integracji mobile_app
      selector:
        device:
          integration: mobile_app

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_avg_liters:
      name: Średni pobór wody przy regeneracji (L)
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 1
          unit_of_measurement: "L"

mode: single

trigger:
  # Co minutę
  - platform: time_pattern
    minutes: "/1"

  # Alarm z czujników zalania (opcjonalne)
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  current_hour: "{{ now().hour }}"
  water_l_min_mean: "{{ state_attr(!input water_sensor, 'mean') | float(0) }}"
  water_lph: "{{ water_l_min_mean * 60 }}"
  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  threshold_l: !input leak_threshold_lph
  now_time: "{{ now().strftime('%H:%M') }}"
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_min: "{{ !input soften_avg_liters - 25 }}"
  soften_max: "{{ !input soften_avg_liters + 25 }}"
  in_soften_window: >
    {{ soften_enabled and soften_start <= now_time <= soften_end }}

action:

  # Czujniki zalania – tylko jeśli lista nie jest pusta
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ flood_sensors | length > 0 and trigger.entity_id in flood_sensors }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie przez czujnik {{ trigger.entity_id }}"

  # Podejrzenie wycieku wody
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ water_lph > avg_hourly + threshold_l }}"
        sequence:
          - choose:
              # Regeneracja zmiękczacza
              - conditions:
                  - condition: template
                    value_template: "{{ in_soften_window and soften_min <= water_lph <= soften_max }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚿 Pobór wody – możliwa regeneracja"
                    message: >
                      Wykryto pobór {{ water_lph | round(1) }} L/h.
                      Zakres odpowiada regeneracji zmiękczacza.
            default:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🚨 PODEJRZENIE WYCIEKU WODY"
                message: >
                  Chwilowy pobór {{ water_lph | round(1) }} L/h
                  przekracza średnią godzinową {{ avg_hourly | round(1) }} L/h.

  # Aktualizacja średniej godzinowej 14-dniowej
  - service: input_number.set_value
    target:
      entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
    data:
      value: >
        {{ ((avg_hourly * 13) + water_lph) / 14 }}

