
# ==========================
# 2️⃣ BLUEPRINT – Water Guardian
# ==========================
blueprint:
  name: Water Guardian – inteligentny monitoring wycieków (15-min mean)
  description: >
    Detekcja wycieków w czasie rzeczywistym + nauka godzinowych norm
    na podstawie 15-minutowych średnich. Obsługuje zmiękczacz i czujniki zalania.
  domain: automation

  input:
    water_sensors:
      name: Sensory przepływu (statistics 15-min, L/min)
      selector:
        entity:
          domain: sensor
          multiple: true

    leak_threshold_lph:
      name: Próg wycieku ponad normę (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie do powiadomień
      selector:
        device:
          integration: mobile_app
          multiple: false

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Start regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_avg_lph:
      name: Typowy pobór regeneracji (L/h)
      default: 200
      selector:
        number:
          min: 50
          max: 800
          step: 10
          unit_of_measurement: "L/h"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  # ====== INPUTY ======
  water_sensors: !input water_sensors
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors

  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_avg_lph: !input soften_avg_lph

  # ====== CZAS ======
  now_time: "{{ now().strftime('%H:%M') }}"
  current_hour: "{{ now().hour }}"

  # ====== ZMIĘKCZACZ ======
  in_soften_window: >
    {{ soften_enabled and soften_start <= now_time <= soften_end }}

  soften_min: "{{ soften_avg_lph * 0.7 }}"
  soften_max: "{{ soften_avg_lph * 1.3 }}"

  # ====== BIEŻĄCY POBÓR ======
  water_l_min_mean: >
    {{ expand(water_sensors)
       | map(attribute='entity_id')
       | map('state_attr', 'mean')
       | map('float', 0)
       | sum }}

  water_lph: "{{ water_l_min_mean * 60 }}"

  # ====== NORMA GODZINOWA (EMA) ======
  avg_hourly: >
    {{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}

action:

  # =========================
  # CZUJNIKI ZALANIA
  # =========================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie: {{ trigger.entity_id }}"
          - stop: "Zalanie – przerwanie dalszych akcji"

  # =========================
  # ZMIĘKCZACZ – IGNORUJ
  # =========================
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ in_soften_window and
                 soften_min <= water_lph <= soften_max }}
        sequence:
          - stop: "Regeneracja zmiękczacza – pomijam"

  # =========================
  # DETEKCJA WYCIEKU
  # =========================
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ avg_hourly > 0 and
                 water_lph > avg_hourly + leak_threshold_lph }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 PODEJRZENIE WYCIEKU"
            message: >
              Pobór {{ water_lph | round(1) }} L/h
              przekracza normę {{ avg_hourly | round(1) }} L/h.

  # =========================
  # AGREGACJA 15-MIN
  # =========================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().minute % 15 == 0 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_hour_liters
            data:
              value: >
                {{ states('input_number.water_hour_liters') | float(0)
                   + (water_l_min_mean * 15) }}

  # =========================
  # STATYSTYKA GODZINOWA (EMA)
  # =========================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().minute == 0 }}"
        sequence:
          - variables:
              hourly_liters: "{{ states('input_number.water_hour_liters') | float(0) }}"
              old_avg: "{{ avg_hourly }}"
          - service: input_number.set_value
            target:
              entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
            data:
              value: >
                {% if old_avg == 0 %}
                  {{ hourly_liters }}
                {% else %}
                  {{ ((old_avg * 13) + hourly_liters) / 14 }}
                {% endif %}
          - service: input_number.set_value
            target:
              entity_id: input_number.water_hour_liters
            data:
              value: 0
