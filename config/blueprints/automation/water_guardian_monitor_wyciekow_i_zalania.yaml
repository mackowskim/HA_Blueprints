blueprint:
  name: Water Guardian – monitor wycieków i zalania (stabilny)
  description: >
    Monitoruje zużycie wody, wykrywa wycieki oraz reaguje na czujniki zalania.
    Obsługuje opcjonalny zmiękczacz wody z regeneracją.
    Blueprint zgodny z najlepszymi praktykami Home Assistant.
  domain: automation

  input:
    water_sensor:
      name: Sensor zużycia wody
      selector:
        entity:
          domain: sensor

    water_unit:
      name: Jednostka sensora
      description: Wybierz jednostkę, w której raportuje sensor
      selector:
        select:
          options:
            - L
            - m3

    notify_device:
      name: Urządzenie do powiadomień
      description: Wybierz urządzenie mobilne (aplikacja HA)
      selector:
        device:
          integration: mobile_app

    flood_sensors:
      name: Czujniki zalania
      description: Opcjonalne czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      description: Czy używasz zmiękczacza z regeneracją
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Początek regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "05:00"
      selector:
        time: {}

    soften_avg_liters:
      name: Średnie zużycie regeneracji (L/h)
      default: 50
      selector:
        number:
          min: 10
          max: 200
          step: 1
          unit_of_measurement: L

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: L

trigger:
  - platform: time_pattern
    minutes: "/5"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_raw: "{{ states(!input water_sensor) | float(0) }}"
  water_lph: >
    {% if is_state('!input water_unit', 'm3') %}
      {{ water_raw * 1000 }}
    {% else %}
      {{ water_raw }}
    {% endif %}

  soften_active: !input soften_enabled
  soften_min: "{{ ( !input soften_avg_liters ) - 25 }}"
  soften_max: "{{ ( !input soften_avg_liters ) + 25 }}"
  now_time: "{{ now().strftime('%H:%M') }}"

condition: []

action:
  - choose:

      # 💧 Czujnik zalania
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.platform == 'state' }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 ZALANIE"
            message: >
              Wykryto zalanie przez czujnik {{ trigger.entity_id }}

      # 🚿 Wysokie zużycie wody
      - conditions:
          - condition: template
            value_template: >
              {{ water_lph > ( !input leak_threshold_lph ) }}
        sequence:
          - choose:

              # 🧂 Prawdopodobna regeneracja zmiękczacza
              - conditions:
                  - condition: template
                    value_template: >
                      {{ soften_active
                         and now_time >= !input soften_start
                         and now_time <= !input soften_end
                         and water_lph >= soften_min
                         and water_lph <= soften_max }}
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "ℹ️ Zużycie wody"
                    message: >
                      Wykryto pobór {{ water_lph | round(1) }} L/h.
                      Prawdopodobna regeneracja zmiękczacza.

              # 🚨 Podejrzenie wycieku
              - conditions: []
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 Podejrzenie wycieku wody"
                    message: >
                      Stały pobór {{ water_lph | round(1) }} L/h
                      przekracza próg {{ !input leak_threshold_lph }} L/h.

mode: single

