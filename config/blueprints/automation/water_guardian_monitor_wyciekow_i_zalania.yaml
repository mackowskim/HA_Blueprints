blueprint:
  name: water_guardian_monitor_wyciekow_i_zalania
  description: >
    Monitor wycieków i zalania.
    - Stały pobór wody i prognozowanie wycieków
    - Wykrywanie zalania (opcjonalne czujniki)
    - Obsługa zmiękczacza wody
    - Powiadomienia mobilne lub persistent notification
  domain: automation

  input:
    water_sensor:
      name: Sensor przepływu (L/min – statistics)
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h ponad średnią)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie mobilne
      selector:
        device:
          integration: mobile_app
          multiple: false

    input_boolean_history:
      name: Input boolean do historii alertów
      selector:
        entity:
          domain: input_boolean
          multiple: false

mode: restart

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_sensor_entity: !input water_sensor
  notify_device_id: !input notify_device
  leak_threshold: !input leak_threshold_lph
  flood_sensors_list: !input flood_sensors
  input_boolean_history: !input input_boolean_history
  current_hour: "{{ now().hour }}"

  water_l_min_mean: "{{ state_attr(water_sensor_entity,'mean') | float(0) }}"
  water_lph: "{{ water_l_min_mean * 60 }}"
  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"

action:
  # 🚨 ZALANIE – natychmiast
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ flood_sensors_list | length > 0 and
                 flood_sensors_list | select('is_state','on') | list | length > 0 }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_id != None }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 ZALANIE!"
                    message: >
                      Aktywne czujniki:
                      {% for s in flood_sensors_list if is_state(s,'on') %}
                      • {{ state_attr(s,'friendly_name') or s }}
                      {% endfor %}
              - default:
                  - service: persistent_notification.create
                    data:
                      title: "🚨 ZALANIE – brak telefonu"
                      message: >
                        Aktywne czujniki:
                        {% for s in flood_sensors_list if is_state(s,'on') %}
                        • {{ state_attr(s,'friendly_name') or s }}
                        {% endfor %}

  # ⚠️ Podejrzenie wycieku
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ water_lph > avg_hourly + leak_threshold }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_id != None }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "⚠️ PODEJRZENIE WYCIEKU WODY"
                    message: >
                      Pobór {{ water_lph | round(1) }} L/h
                      przekracza średnią {{ avg_hourly | round(1) }} L/h
              - default:
                  - service: persistent_notification.create
                    data:
                      title: "⚠️ PODEJRZENIE WYCIEKU WODY"
                      message: >
                        Pobór {{ water_lph | round(1) }} L/h
                        przekracza średnią {{ avg_hourly | round(1) }} L/h

  # 🧠 Aktualizacja średniej godzinowej (14 dni)
  - service: input_number.set_value
    target:
      entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
    data:
      value: "{{ ((avg_hourly * 13) + water_lph) / 14 }}"

