blueprint:
  name: Water Guardian – detektor wycieków i zalania (v5)
  description: >
    Detekcja wycieków i zalania w oparciu o godzinowy pobór z utility_meter.
    EMA godzinowa 14-dniowa liczona w 59. minucie.
    Alarmy po 3 kolejnych godzinach przekroczenia progu (opcjonalnie streak).
    Obsługuje powiadomienia z czujników zalania i wycieku.
    Chroni przed alarmem podczas pracy zmiękczacza.
    Wersja v5: opcjonalne powiadomienia TTS na media_player i drugie urządzenie mobilne.
  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie do powiadomień mobilnych
      selector:
        device:
          integration: mobile_app
          multiple: false

    notify_device_secondary:
      name: Drugie urządzenie mobilne (opcjonalne)
      default: null
      selector:
        device:
          integration: mobile_app
          multiple: false

    media_players:
      name: Urządzenia multimedialne do powiadomień (TTS, opcjonalne)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_lph:
      name: Minimalny pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    soften_max_lph:
      name: Maksymalny pobór zmiękczacza (L/h)
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    leak_action:
      name: Automatyzacja przy wycieku (opcjonalnie)
      default: []
      selector:
        action: {}

    use_hourly_streak:
      name: Używać streak (3 godziny z rzędu)
      default: true
      selector:
        boolean: {}

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_min_lph: !input soften_min_lph
  soften_max_lph: !input soften_max_lph
  flood_action: !input flood_action
  leak_action: !input leak_action
  use_hourly_streak: !input use_hourly_streak

  now_time: "{{ now().strftime('%H:%M') }}"
  current_hour: "{{ now().hour }}"
  minute: "{{ now().minute }}"
  in_soften_window: "{{ soften_enabled and soften_start <= now_time <= soften_end }}"

  raw_hour_value: "{{ states(water_hour_meter) | float(0) }}"
  unit: "{{ state_attr(water_hour_meter, 'unit_of_measurement') | lower }}"
  water_hour_l: >
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw_hour_value * 1000) | round(1) }}
    {% else %}
      {{ raw_hour_value | round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  leak_streak: "{{ states('input_number.water_leak_streak') | int(0) }}"
  zero_hour_streak: "{{ states('input_number.water_zero_hour_streak') | int(0) }}"

action:

  # ===== CZUJNIKI ZALANIA =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: !input flood_action
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: >
              Wykryto zalanie: {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_secondary is not none }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "💧 ZALANIE!"
                    message: >
                      Wykryto zalanie: {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
          - stop: "Zalanie – przerwanie dalszych akcji"

  # ===== GODZINOWA DETEKCJA WYCIEKU =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not in_soften_window and water_hour_l > avg_hourly + leak_threshold_lph }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_hourly_streak }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_leak_streak
                    data:
                      value: "{{ leak_streak + 1 }}"
      - conditions:
          - condition: template
            value_template: "{{ not (water_hour_l > avg_hourly + leak_threshold_lph) }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (use_hourly_streak and leak_streak >= 3) or (not use_hourly_streak and water_hour_l > avg_hourly + leak_threshold_lph) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ leak_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: !input leak_action
          # Powiadomienia mobilne
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: >
              Pobór {{ water_hour_l | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} L/h
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_secondary is not none }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK WODY"
                    message: >
                      Pobór {{ water_hour_l | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} L/h
          # TTS na media_player – tylko jeśli wybrane
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_translate_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            message: "Uwaga! Możliwe wycieki wody. Sprawdź licznik."
                            language: "pl"
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  # ===== GODZINOWA DETEKCJA ZMIĘKCZACZA (minuta 59) =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_soften_window and minute == 59 }}"
        sequence:
          - variables:
              threshold: "{{ avg_hourly + leak_threshold_lph }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ soften_min_lph <= water_hour_l <= soften_max_lph }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "💧 Zmiękczacz w pracy"
                    message: >
                      Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L
                      – prawdopodobnie praca zmiękacza.
              - conditions:
                  - condition: template
                    value_template: "{{ water_hour_l > threshold }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ leak_action | length > 0 }}"
                        sequence:
                          - service: automation.trigger
                            target:
                              entity_id: !input leak_action
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 PODEJRZENIE WYCIEKU (godzinowe)"
                    message: >
                      Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L
                      przekracza średnią {{ avg_hourly | round(1) }} L + próg {{ leak_threshold_lph }} L

  # ===== EMA godzinowa 14 dni =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ minute == 59 }}"
        sequence:
          - variables:
              old_avg: "{{ avg_hourly }}"
          - service: input_number.set_value
            target:
              entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
            data:
              value: >
                {% if old_avg == 0 %}
                  {{ water_hour_l | round(1) }}
                {% else %}
                  {{ ((old_avg * 13) + water_hour_l) / 14 | round(1) }}
                {% endif %}

  # ===== GODZINY HISTORYCZNIE ZEROWE – 3x z rzędu =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ avg_hourly < 0.5 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ not (avg_hourly < 0.5 and water_hour_l > 0) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: 0
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ zero_hour_streak >= 3 }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK – nietypowe godziny"
                    message: >
                      Pobór w godzinach historycznie zerowych przez 3 kolejne godziny.

