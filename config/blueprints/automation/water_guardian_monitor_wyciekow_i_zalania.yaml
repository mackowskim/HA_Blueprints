blueprint:
  name: Water Guardian – Leak & Flood Detector v0.98
  description: >
    Detekcja wycieków i zalania z EMA godzinową,
    powiadomienia mobilne i TTS. Minutowa detekcja wycieku z cooldownem.
    Wszystkie helpery są neutralne, bez “liw01”.

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe (hourly)
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    notify_device:
      name: Urządzenie do powiadomień (główne)
      selector:
        device:
          integration: mobile_app

    notify_device_secondary:
      name: Drugie urządzenie (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    language:
      name: Wersja językowa powiadomień
      default: "PL"
      selector:
        select:
          options: [PL, EN]

    leak_cooldown_minutes:
      name: Cooldown minutowy alertu wycieku
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: "min"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  flood_action: !input flood_action
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  language: !input language
  leak_cooldown_minutes: !input leak_cooldown_minutes

  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"

  # ===== HOURLY WATER (NORMALIZED TO L) =====
  water_hour_l: >-
    {% set raw = states(water_hour_meter) | float(0) %}
    {% set unit = state_attr(water_hour_meter, 'unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw * 1000) | round(1) }}
    {% else %}
      {{ raw | round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.water_hour_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.zero_hour_streak') | int(0) }}"
  last_alert: "{{ states('input_datetime.last_alert') }}"

  alert_allowed: >-
    {% if last_alert in ['unknown','unavailable',''] %}
      true
    {% else %}
      {{ (now().timestamp() - strptime(last_alert, '%Y-%m-%d %H:%M:%S').timestamp()) > leak_cooldown_minutes * 60 }}
    {% endif %}

action:
  # ================== FLOOD ==================
  - choose:
      - conditions: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    entity_id: !input flood_action

          # Powiadomienie główne
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ '💧 ZALANIE!' if language == 'PL' else '💧 FLOOD!' }}"
            message: >
              {{ 'Wykryto zalanie: ' if language == 'PL' else 'Flood detected: ' }}
              {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          # Powiadomienie drugie, jeśli ustawione
          - choose:
              - conditions: "{{ notify_device_secondary | length > 0 }}"
                sequence:
                  - service: notify.mobile_app_{{ notify_device_secondary }}
                    data:
                      title: "{{ '💧 ZALANIE!' if language == 'PL' else '💧 FLOOD!' }}"
                      message: >
                        {{ 'Wykryto zalanie: ' if language == 'PL' else 'Flood detected: ' }}
                        {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          # TTS na media players
          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{{ 'pl' if language == 'PL' else 'en' }}"
                            message: >
                              {{ 'Uwaga! Wykryto zalanie.' if language == 'PL' else 'Warning! Flood detected.' }}

          - stop: "Flood handled"

  # ================== LEAK (MINUTE) ==================
  - choose:
      - conditions: >
          {{ water_hour_l > avg_hourly + leak_threshold_lph and alert_allowed }}
        sequence:
          # Główne powiadomienie
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ '🚨 WYCIEK WODY' if language == 'PL' else '🚨 WATER LEAK' }}"
            message: >
              {{ water_hour_l }} L/h >
              {{ avg_hourly }} + {{ leak_threshold_lph }} L

          # Drugie powiadomienie tylko jeśli ustawione
          - choose:
              - conditions: "{{ notify_device_secondary | length > 0 }}"
                sequence:
                  - service: notify.mobile_app_{{ notify_device_secondary }}
                    data:
                      title: "{{ '🚨 WYCIEK WODY' if language == 'PL' else '🚨 WATER LEAK' }}"
                      message: >
                        {{ water_hour_l }} L/h >
                        {{ avg_hourly }} + {{ leak_threshold_lph }} L

          # TTS
          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{{ 'pl' if language == 'PL' else 'en' }}"
                            message: >
                              {{ 'Uwaga! Wykryto możliwy wyciek wody.'
                                 if language == 'PL'
                                 else 'Warning! Possible water leak detected.' }}

          # Zapis czasu alertu
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.last_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ================== ZERO-HOUR STREAK ==================
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
            default:
              - service: input_number.set_value
                target:
                  entity_id: input_number.zero_hour_streak
                data:
                  value: 0

