blueprint:
  name: Water Guardian – detektor wycieków i zalania
  description: >
    Detekcja wycieków na podstawie utility_meter (godzinowego) w jednostce licznika.
    Minutowa detekcja poza pracą zmiękczacza.
    Godzinowa detekcja w trakcie pracy zmiękczacza.
    EMA 14-dniowa liczona z przeliczonej wartości w litrach.
    Obsługuje czujniki zalania i zewnętrzne automatyzacje.
  domain: automation

  input:
    # -------------------------
    # Sensor z utility_meter (godzinowy)
    # -------------------------
    water_hour_meter:
      name: Utility meter – zużycie godzinowe (jednostka licznika)
      selector:
        entity:
          domain: sensor

    # -------------------------
    # Sensor chwilowego przepływu w L/min (do minutowej detekcji)
    # -------------------------
    water_flow_sensor:
      name: Sensor chwilowego przepływu (L/min)
      selector:
        entity:
          domain: sensor

    # -------------------------
    # Próg wycieku w L/h
    # -------------------------
    leak_threshold_l:
      name: Próg wycieku (L / godz.)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: "L"

    # -------------------------
    # Czujniki zalania (opcjonalne)
    # -------------------------
    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    # -------------------------
    # Zmiękczacz wody (okno pracy)
    # -------------------------
    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Start regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_l:
      name: Min. zużycie zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: "L"

    soften_max_l:
      name: Max. zużycie zmiękczacza (L/h)
      default: 120
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "L"

    # -------------------------
    # Automatyzacje wywoływane przy zalaniu i wycieku (opcjonalne)
    # -------------------------
    flood_action:
      name: Akcja przy zalaniu
      default: []
      selector:
        action: {}

    leak_action:
      name: Akcja przy wycieku
      default: []
      selector:
        action: {}

mode: single

trigger:
  # Trigger co minutę do detekcji minutowej i zliczania czasu zmiękczacza
  - platform: time_pattern
    minutes: "/1"

  # Trigger na czujnikach zalania
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  # =============================
  # Odczyt godzinowy z utility_meter
  # =============================
  raw_hour_value: "{{ states(!input water_hour_meter) | float(0) }}"
  unit: "{{ state_attr(!input water_hour_meter, 'unit_of_measurement') | lower }}"

  # Przeliczenie na litry do logiki wewnętrznej
  water_hour_l: >
    {% if unit in ['m³','m3','m^3'] %}
      {{ raw_hour_value * 1000 }}
    {% else %}
      {{ raw_hour_value }}
    {% endif %}

  # =============================
  # Minutowy pobór chwilowy (L/h)
  # =============================
  flow_lph: "{{ states(!input water_flow_sensor) | float(0) * 60 }}"

  # =============================
  # Czas i okno pracy zmiękczacza
  # =============================
  now_time: "{{ now().strftime('%H:%M') }}"
  hour: "{{ now().hour }}"
  in_soften: >
    {{ !input soften_enabled and false or
       (!input soften_start <= now_time <= !input soften_end) }}

  avg_hour: "{{ states('input_number.zuzycie_wody_stat_' ~ hour) | float(0) }}"

action:

  # =============================
  # CZUJNIKI ZALANIA
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in !input flood_sensors }}"
        sequence:
          # Wywołanie opcjonalnej automatyzacji przy zalaniu
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ !input flood_action != [] }}"
                sequence:
                  - choose: !input flood_action
          - stop  # przerwanie dalszych akcji, bo zalanie to krytyczne

  # =============================
  # MINUTOWA DETEKCJA WYCIEKU (poza oknem zmiękczacza)
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ not in_soften
                 and avg_hour > 0
                 and flow_lph > avg_hour + !input leak_threshold_l }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ !input leak_action != [] }}"
                sequence:
                  - choose: !input leak_action

  # =============================
  # GODZINOWA DETEKCJA ZMIĘKCZACZA
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_soften and now().minute == 0 }}"
        sequence:
          - choose:
              # normalna praca zmiękczacza
              - conditions:
                  - condition: template
                    value_template: >
                      {{ !input soften_min_l <= water_hour_l <= !input soften_max_l }}
                sequence:
                  - choose: []  # tylko informacyjnie, brak alarmu

              # wyciek powyżej średniej + próg
              - conditions:
                  - condition: template
                    value_template: >
                      {{ water_hour_l > avg_hour + !input leak_threshold_l }}
                sequence:
                  - choose: !input leak_action

  # =============================
  # EMA GODZINOWA (14 dni)
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().minute == 0 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: "input_number.zuzycie_wody_stat_{{ hour }}"
            data:
              value: >
                {% set old = avg_hour %}
                {% if old == 0 %}
                  {{ water_hour_l }}
                {% else %}
                  {{ ((old * 13) + water_hour_l) / 14 }}
                {% endif %}

