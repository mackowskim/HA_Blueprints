blueprint:
  name: Water Guardian – detektor wycieków i zalania
  description: >
    Detekcja wycieków i zalania w oparciu o utility_meter godzinowy.
    Minutowa detekcja działa poza pracą zmiękczacza.
    Godzinowa detekcja działa w trakcie pracy zmiękczacza.
    EMA 14-dniowa liczona z przeliczonej wartości w litrach.
    Obsługuje zmiękczacz wody i czujniki zalania, opcjonalnie wywołuje automatyzacje.
  domain: automation

  input:
    # =============================
    # Utility meter godzinowy
    # =============================
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    # =============================
    # Sensor przepływu do minutowej detekcji (L/min lub 15-min mean)
    # =============================
    water_flow_sensor:
      name: Sensor przepływu (L/min lub 15-min mean)
      selector:
        entity:
          domain: sensor

    # =============================
    # Próg wycieku w litrach na godzinę
    # =============================
    leak_threshold_l:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: "L"

    # =============================
    # Czujniki zalania (opcjonalne)
    # =============================
    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    # =============================
    # Zmiękczacz wody (okno pracy)
    # =============================
    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Start regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Koniec regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_l:
      name: Minimalny pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: "L"

    soften_max_l:
      name: Maksymalny pobór zmiękczacza (L/h)
      default: 120
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "L"

    # =============================
    # Opcjonalne akcje przy zalaniu i wycieku
    # =============================
    flood_action:
      name: Akcja przy zalaniu
      default: []
      selector:
        action: {}

    leak_action:
      name: Akcja przy wycieku
      default: []
      selector:
        action: {}

mode: single

trigger:
  # co minutę – do minutowej detekcji i sprawdzania zmiękczacza
  - platform: time_pattern
    minutes: "/1"

  # trigger dla czujników zalania
  - platform: state
    entity_id: flood_sensors
    to: "on"

variables:
  # =============================
  # Odczyt godzinowy z utility_meter
  # =============================
  raw_hour_value: "{{ states(water_hour_meter) | float(0) }}"
  unit: "{{ state_attr(water_hour_meter, 'unit_of_measurement') | lower }}"
  water_hour_l: >
    {% if unit in ['m³','m3','m^3'] %}
      {{ raw_hour_value * 1000 }}
    {% else %}
      {{ raw_hour_value }}
    {% endif %}

  # =============================
  # Minutowy pobór w L/h
  # =============================
  flow_lph: "{{ states(water_flow_sensor) | float(0) * 60 }}"

  # =============================
  # Czas i okno pracy zmiękczacza
  # =============================
  now_time: "{{ now().strftime('%H:%M') }}"
  hour: "{{ now().hour }}"
  in_soften: >
    {{ soften_enabled and (soften_start <= now_time <= soften_end) }}

  # =============================
  # Średnia godzinowa (EMA) dla aktualnej godziny
  # =============================
  avg_hour: "{{ states('input_number.zuzycie_wody_stat_' ~ hour) | float(0) }}"

action:
  # =============================
  # Obsługa zalania
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ flood_action != [] }}"
                sequence:
                  - choose: flood_action
          - stop: "Zalanie wykryte – przerwanie dalszych akcji"

  # =============================
  # Minutowa detekcja wycieku (poza zmiękczaczem)
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ not in_soften and avg_hour > 0 and flow_lph > avg_hour + leak_threshold_l }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ leak_action != [] }}"
                sequence:
                  - choose: leak_action

  # =============================
  # Godzinowa detekcja pracy zmiękczacza i wycieku
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_soften and now().minute == 0 }}"
        sequence:
          - choose:
              # normalna praca zmiękczacza (bez alarmu)
              - conditions:
                  - condition: template
                    value_template: >
                      {{ soften_min_l <= water_hour_l <= soften_max_l }}
                sequence:
                  - stop: "Praca zmiękczacza w normie – brak alarmu"

              # wyciek w trakcie pracy zmiękczacza
              - conditions:
                  - condition: template
                    value_template: >
                      {{ water_hour_l > avg_hour + leak_threshold_l }}
                sequence:
                  - choose: leak_action

  # =============================
  # EMA godzinowa (14 dni)
  # =============================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().minute == 0 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: "input_number.zuzycie_wody_stat_{{ hour }}"
            data:
              value: >
                {% set old = avg_hour %}
                {% if old == 0 %}
                  {{ water_hour_l }}
                {% else %}
                  {{ ((old * 13) + water_hour_l) / 14 }}
                {% endif %}

