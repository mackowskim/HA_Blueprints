blueprint:
  name: Water Guardian – Leak & Flood Detector LIW01 (v0.96)
  description: >
    Detekcja wycieków i zalania z EMA godzinową,
    powiadomienia mobilne i TTS. Minutowa detekcja wycieku z cooldownem 30 min.
    Wszystkie encje korzystają z dedykowanych helperów waterguard_liw01.

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe (hourly)
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    notify_device:
      name: Urządzenie do powiadomień (główne)
      selector:
        device:
          integration: mobile_app

    notify_device_secondary:
      name: Drugie urządzenie (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    language:
      name: Wersja językowa powiadomień
      default: "PL"
      selector:
        select:
          options:
            - PL
            - EN

    leak_cooldown_minutes:
      name: Cooldown minutowy alertu wycieku
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: "min"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  flood_action: !input flood_action
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  language: !input language
  leak_cooldown_minutes: !input leak_cooldown_minutes

  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"

  # Przeliczenie jednostki – używa helpera waterguard_liw01_hourly_meter
  water_hour_l: >-
    {% set raw = states('sensor.waterguard_liw01_hourly_meter') | float(0) %}
    {% set unit = state_attr('sensor.waterguard_liw01_total_meter','unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw * 1000) | round(1) }}
    {% else %}
      {{ raw | round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.waterguard_liw01_hour_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.waterguard_liw01_zero_hour_streak') | int(0) }}"
  last_alert: "{{ states('input_datetime.waterguard_liw01_last_alert') }}"
  alert_allowed: >-
    {% if last_alert in ['unknown','unavailable',''] %}
      true
    {% else %}
      {{ (now().timestamp() - strptime(last_alert, '%Y-%m-%d %H:%M:%S').timestamp()) > leak_cooldown_minutes*60 }}
    {% endif %}

action:
  # ===== ZALANIE =====
  - choose:
      - conditions: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    entity_id: !input flood_action

          # powiadomienia
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: >
              {% if language == 'PL' %}💧 ZALANIE!{% else %}💧 FLOOD!{% endif %}
            message: >
              {% if language == 'PL' %}
                Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
              {% else %}
                Flood detected: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
              {% endif %}

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: >
                      {% if language == 'PL' %}💧 ZALANIE!{% else %}💧 FLOOD!{% endif %}
                    message: >
                      {% if language == 'PL' %}
                        Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
                      {% else %}
                        Flood detected: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
                      {% endif %}

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{% if language == 'PL' %}pl{% else %}en{% endif %}"
                            message: >
                              {% if language == 'PL' %}
                                Uwaga! Wykryto zalanie.
                              {% else %}
                                Warning! Flood detected.
                              {% endif %}

          - stop: "Zalanie – zakończenie automatyzacji"

  # ===== MINUTOWA DETEKCJA WYCIEKU =====
  - choose:
      - conditions: >
          {{ water_hour_l > avg_hourly + leak_threshold_lph and alert_allowed }}
        sequence:
          # powiadomienia
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: >
              {% if language == 'PL' %}🚨 WYCIEK WODY{% else %}🚨 WATER LEAK{% endif %}
            message: >
              {% if language == 'PL' %}
                Zużycie {{ water_hour_l | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L
              {% else %}
                Consumption {{ water_hour_l | round(1) }} L/h exceeds average {{ avg_hourly | round(1) }} + threshold {{ leak_threshold_lph }} L
              {% endif %}

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: >
                      {% if language == 'PL' %}🚨 WYCIEK WODY{% else %}🚨 WATER LEAK{% endif %}
                    message: >
                      {% if language == 'PL' %}
                        Zużycie {{ water_hour_l | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L
                      {% else %}
                        Consumption {{ water_hour_l | round(1) }} L/h exceeds average {{ avg_hourly | round(1) }} + threshold {{ leak_threshold_lph }} L
                      {% endif %}

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{% if language == 'PL' %}pl{% else %}en{% endif %}"
                            message: >
                              {% if language == 'PL' %}
                                Uwaga! Wykryto możliwy wyciek wody.
                              {% else %}
                                Warning! Possible water leak detected.
                              {% endif %}

          # zapis czasu alertu
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.waterguard_liw01_last_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ===== GODZINY HISTORYCZNIE ZEROWE – 3x =====
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.waterguard_liw01_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - conditions: "{{ not (avg_hourly == 0 and water_hour_l > 0) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.waterguard_liw01_zero_hour_streak
                    data:
                      value: 0

