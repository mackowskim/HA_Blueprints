blueprint:
  name: Water Guardian – inteligentny monitoring wycieków (15-min średnia)
  description: >
    Monitoruje chwilowy pobór wody na podstawie 15-minutowej średniej (statistics),
    porównuje z 14-dniową średnią godzinową i wysyła powiadomienia.
    Obsługuje opcjonalne czujniki zalania i zmiękczacz wody.
  domain: automation

  input:
    water_sensors:
      name: Sensory przepływu (L/min, statistics 15-min)
      description: Lista czujników, które mierzą średni pobór wody w L/min
      selector:
        entity:
          domain: sensor
          multiple: true

    water_unit:
      name: Jednostka sensora
      default: L
      selector:
        select:
          options:
            - label: "litry"
              value: l
            - label: "m³"
              value: m3

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie mobilne do powiadomień
      selector:
        device:
          integration: mobile_app
          multiple: false

mode: single

trigger:
  # Detekcja co minutę
  - platform: time_pattern
    minutes: "/1"

  # Alarm z czujników zalania (opcjonalne)
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  current_hour: "{{ now().hour }}"
  # pobieramy 15-min średnie z wszystkich sensorów i sumujemy na minutę
  water_l_min_mean: >
    {{ expand(water_sensors) | map(attribute='attributes.mean') | map('float') | sum }}
  water_lph: "{{ water_l_min_mean * 60 }}"
  # pobieramy aktualną średnią godzinową z input_number (14-dni EMA)
  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  now_time: "{{ now().strftime('%H:%M') }}"

action:

  # -------------------------
  # 1️⃣ DETEKCJA wycieku
  # -------------------------
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ water_lph > avg_hourly + leak_threshold_lph }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 PODEJRZENIE WYCIEKU WODY"
            message: >
              Chwilowy pobór {{ water_lph | round(1) }} L/h
              przekracza średnią godzinową {{ avg_hourly | round(1) }} L/h.

  # Czujniki zalania – tylko jeśli lista nie jest pusta
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ flood_sensors | length > 0 and trigger.entity_id in flood_sensors }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie przez czujnik {{ trigger.entity_id }}"

  # -------------------------
  # 2️⃣ STATYSTYKA – aktualizacja EMA (raz na godzinę)
  # -------------------------
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().minute == 0 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
            data:
              value: >
                {% if avg_hourly == 0 %}
                  {{ water_lph }}
                {% else %}
                  {{ ((avg_hourly * 13) + water_lph) / 14 }}
                {% endif %}

