blueprint:
  name: Water Guardian – detektor wycieków i zalania (v0.92)
  description: >
    Detekcja wycieków i zalania z obsługą zmiękczacza, EMA 14-dniową,
    powiadomienia mobilne i TTS na media_player.
    Minutowa detekcja wycieku z cooldownem 30 min (bez spamu).
    3x streak tylko dla godzin historycznie zerowych.

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    notify_device:
      name: Urządzenie do powiadomień (główne)
      selector:
        device:
          integration: mobile_app

    notify_device_secondary:
      name: Drugie urządzenie (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_lph:
      name: Minimalny pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    soften_max_lph:
      name: Maksymalny pobór zmiękczacza (L/h)
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  flood_action: !input flood_action
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_min_lph: !input soften_min_lph
  soften_max_lph: !input soften_max_lph

  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"
  in_soften_window: "{{ soften_enabled and soften_start <= now_time <= soften_end }}"

  water_hour_l: >-
    {% set raw = states(water_hour_meter) | float(0) %}
    {% set unit = state_attr(water_hour_meter,'unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw * 1000) | round(1) }}
    {% else %}
      {{ raw | round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.water_zero_hour_streak') | int(0) }}"

  last_alert: "{{ states('input_datetime.water_leak_last_alert') }}"
  alert_allowed: >-
    {% if last_alert in ['unknown','unavailable',''] %}
      true
    {% else %}
      {{ (now().timestamp() - strptime(last_alert, '%Y-%m-%d %H:%M:%S').timestamp()) > 1800 }}
    {% endif %}

action:

  # ===== ZALANIE =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    entity_id: !input flood_action

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: >
              Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "💧 ZALANIE!"
                    message: >
                      Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "Uwaga! Wykryto zalanie."

          - stop: "Zalanie – zakończenie automatyzacji"

  # ===== MINUTOWA DETEKCJA WYCIEKU (COOLDOWN 30 MIN) =====
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ not in_soften_window
                 and water_hour_l > avg_hourly + leak_threshold_lph
                 and alert_allowed }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: >
              Zużycie {{ water_hour_l | round(1) }} L/h
              przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK WODY"
                    message: >
                      Zużycie {{ water_hour_l | round(1) }} L/h
                      przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "Uwaga! Wykryto możliwy wyciek wody."

          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.water_leak_last_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ===== GODZINY HISTORYCZNIE ZEROWE – 3x =====
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - conditions: "{{ not (avg_hourly == 0 and water_hour_l > 0) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: 0

          - choose:
              - conditions: "{{ zero_hour_streak >= 3 }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK – nietypowe godziny"
                    message: >
                      Pobór w godzinach historycznie zerowych
                      przez 3 kolejne godziny.

