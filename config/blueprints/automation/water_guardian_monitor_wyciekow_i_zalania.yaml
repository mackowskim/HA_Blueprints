blueprint:
  name: Water Guardian – monitor wycieków i zalania
  description: >
    Monitor zużycia wody oraz czujników zalania.
    Obsługuje liczniki w L lub m³ oraz opcjonalny zmiękczacz wody
    (regeneracja oznaczana jako prawdopodobna, bez pauzowania alarmów).
  domain: automation

  input:
    water_sensor:
      name: Sensor zużycia wody
      selector:
        entity:
          domain: sensor

    water_unit:
      name: Jednostka sensora
      default: m3
      selector:
        select:
          options:
            - label: "m³"
              value: m3
            - label: "litry"
              value: l

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 10
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_devices:
      name: Urządzenia do powiadomień (device_tracker)
      selector:
        entity:
          domain: device_tracker
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean:

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time:

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time:

    soften_avg_liters:
      name: Średni pobór wody przy regeneracji (L)
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 1
          unit_of_measurement: "L"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/5"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_sensor: !input water_sensor
  water_unit: !input water_unit
  leak_threshold_lph: !input leak_threshold_lph

  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_avg_liters: !input soften_avg_liters

  water_raw: "{{ states(water_sensor) | float(0) }}"

  water_lph: >
    {% if water_unit == 'm3' %}
      {{ water_raw * 1000 }}
    {% else %}
      {{ water_raw }}
    {% endif %}

  now_time: "{{ now().strftime('%H:%M') }}"

  soften_min: "{{ soften_avg_liters - 25 }}"
  soften_max: "{{ soften_avg_liters + 25 }}"

  in_soften_window: >
    {{ soften_enabled and
       soften_start <= now_time <= soften_end }}

action:
  - choose:

      # === CZUJNIK ZALANIA ===
      - conditions:
          - condition: trigger
            id: state
        sequence:
          - service: notify.notify
            data:
              title: "💧 ZALANIE!"
              message: "Wykryto zalanie – natychmiast sprawdź instalację."

      # === WYCIEK WODY ===
      - conditions:
          - condition: template
            value_template: "{{ water_lph >= leak_threshold_lph }}"
        sequence:
          - choose:

              # Regeneracja zmiękczacza (ostrzeżenie)
              - conditions:
                  - condition: template
                    value_template: >
                      {{ in_soften_window and
                         soften_min <= water_lph <= soften_max }}
                sequence:
                  - service: notify.notify
                    data:
                      title: "🚿 Pobór wody – możliwa regeneracja"
                      message: >
                        Wykryto pobór {{ water_lph | round(1) }} L/h.
                        Zakres odpowiada regeneracji zmiękczacza.

            default:
              - service: notify.notify
                data:
                  title: "🚨 PODEJRZENIE WYCIEKU WODY"
                  message: >
                    Stały pobór {{ water_lph | round(1) }} L/h
                    przekracza próg {{ leak_threshold_lph }} L/h.


