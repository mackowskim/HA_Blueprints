blueprint:
  name: Water Guardian – detektor wycieków i zalania (v0.7)
  description: >
    Detekcja wycieków i zalania. Uwzględnia zmiękczacz, EMA 14-dniową,
    limit streak wycieku oraz powiadomienia mobilne i TTS na media_player.

    **Zmiany od v0.6:**
    - Dodany brakujący input `flood_action` (opcjonalna automatyzacja przy zalaniu)
    - Poprawione warunki streak i limit powtórzeń
    - Ujednolicone nazwy helperów Water Guardian
    - Poprawione powiadomienia mobilne i TTS

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    water_flow_sensor:
      name: Sensor przepływu (opcjonalny)
      default: ""
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    use_streak:
      name: Używać streak (3 godziny z rzędu)
      description: >
        Jeżeli włączone, alarm wycieku wysyłany jest dopiero po zadeklarowanej liczbie kolejnych godzin przekroczenia średniego poboru.
      default: true
      selector:
        boolean: {}

    leak_streak_limit:
      name: Water Guardian – próg alarmu wycieku (liczba powtórzeń)
      default: 3
      selector:
        number:
          min: 1
          max: 30
          step: 1

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    notify_device_primary:
      name: Urządzenie mobilne główne
      selector:
        device:
          integration: mobile_app
          multiple: false

    notify_device_secondary:
      name: Urządzenie mobilne drugie (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app
          multiple: false

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_lph:
      name: Minimalny pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    soften_max_lph:
      name: Maksymalny pobór zmiękczacza (L/h)
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"
  in_soften_window: "{{ !input 'soften_enabled' and (now_time >= soften_start and now_time <= soften_end) }}"

  water_hour_l: >-
    {% set raw = states(!input 'water_hour_meter') | float(0) %}
    {% set unit = state_attr(!input 'water_hour_meter','unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}{{ (raw*1000)|round(1) }}{% else %}{{ raw|round(1) }}{% endif %}

  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  leak_streak: "{{ states('input_number.water_leak_streak') | int(0) }}"
  zero_hour_streak: "{{ states('input_number.water_zero_hour_streak') | int(0) }}"
  leak_limit: "{{ states('input_number.water_leak_streak_limit') | int(!input 'leak_streak_limit') }}"

  water_lph: >-
    {% if !input 'water_flow_sensor' %}
      0
    {% else %}
      {{ ([states(!input 'water_flow_sensor') | float(0) * 60, 1000] | min) }}
    {% endif %}

action:

  # ===== ZALANIE =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in !input 'flood_sensors' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ !input 'flood_action' | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: !input 'flood_action'
          - device_id: !input 'notify_device_primary'
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie: {{ trigger.entity_id }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ !input 'notify_device_secondary' != '' }}"
                sequence:
                  - device_id: !input 'notify_device_secondary'
                    domain: mobile_app
                    type: notify
                    title: "💧 ZALANIE!"
                    message: "Wykryto zalanie: {{ trigger.entity_id }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "💧 ZALANIE! Wykryto zalanie: {{ trigger.entity_id }}"

  # ===== MINUTOWA DETEKCJA WYCIEKU =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not in_soften_window and water_lph > avg_hourly + leak_threshold_lph }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: "{{ leak_streak + 1 }}"
      - conditions:
          - condition: template
            value_template: "{{ water_lph <= avg_hourly + leak_threshold_lph }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ leak_streak >= leak_limit if !input 'use_streak' else leak_streak >= 1 }}
        sequence:
          - device_id: !input 'notify_device_primary'
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: "Stały pobór {{ water_lph | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} L/h"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ !input 'notify_device_secondary' != '' }}"
                sequence:
                  - device_id: !input 'notify_device_secondary'
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK WODY"
                    message: "Stały pobór {{ water_lph | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} L/h"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "🚨 WYCIEK WODY! Stały pobór {{ water_lph | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} L/h"
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  # ===== GODZINOWA DETEKCJA ZMIĘKCZACZA =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_soften_window and minute == 59 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ soften_min_lph <= water_hour_l <= soften_max_lph }}"
                sequence:
                  - device_id: !input 'notify_device_primary'
                    domain: mobile_app
                    type: notify
                    title: "💧 Zmiękczacz w pracy"
                    message: "Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ water_hour_l > avg_hourly + leak_threshold_lph }}"
                sequence:
                  - device_id: !input 'notify_device_primary'
                    domain: mobile_app
                    type: notify
                    title: "🚨 PODEJRZENIE WYCIEKU (godzinowe)"
                    message: "Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L przekracza średnią {{ avg_hourly | round(1) }} L + próg {{ leak_threshold_lph }} L"

