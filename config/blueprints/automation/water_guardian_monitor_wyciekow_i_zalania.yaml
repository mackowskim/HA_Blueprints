blueprint:
  name: Water Guardian – Leak & Flood Detector v1.0
  description: >
    Minutowa detekcja wycieku wody oparta o godzinowy utility_meter
    oraz EMA 14-dniową per godzina.
    Obsługa czujników zalania, zero-hour streak, powiadomienia mobilne i TTS.

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Akcja przy zalaniu (opcjonalna)
      default: []
      selector:
        action: {}

    notify_device:
      name: Urządzenie powiadomień (główne)
      selector:
        device:
          integration: mobile_app

    notify_device_secondary:
      name: Drugie urządzenie (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    language:
      name: Język komunikatów
      default: PL
      selector:
        select:
          options: [PL, EN]

    leak_cooldown_minutes:
      name: Cooldown alertu wycieku
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  flood_sensors: !input flood_sensors
  leak_threshold_lph: !input leak_threshold_lph
  leak_cooldown_minutes: !input leak_cooldown_minutes
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  language: !input language

  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"

  # Aktualne zużycie godzinowe w litrach
  water_hour_l: >-
    {% set raw = states(water_hour_meter) | float(0) %}
    {% set unit = state_attr(water_hour_meter,'unit_of_measurement') | lower %}
    {% if unit in ['m3','m³','m^3'] %}
      {{ (raw * 1000) | round(1) }}
    {% else %}
      {{ raw | round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.waterguard_hour_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.waterguard_zero_hour_streak') | int(0) }}"
  last_alert: "{{ states('input_datetime.waterguard_last_alert') }}"

  alert_allowed: >-
    {% if last_alert in ['unknown','unavailable',''] %}
      true
    {% else %}
      {{ (now().timestamp() - strptime(last_alert,'%Y-%m-%d %H:%M:%S').timestamp())
         > leak_cooldown_minutes * 60 }}
    {% endif %}

action:
  # ================= FLOOD =================
  - choose:
      - conditions: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence: !input flood_action

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ '💧 ZALANIE!' if language == 'PL' else '💧 FLOOD!' }}"
            message: >
              {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          - choose:
              - conditions: "{{ notify_device_secondary | length > 0 }}"
                sequence:
                  - service: notify.mobile_app_{{ notify_device_secondary }}
                    data:
                      title: "{{ '💧 ZALANIE!' if language == 'PL' else '💧 FLOOD!' }}"
                      message: >
                        {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}

          - stop: "Flood handled"

  # ================= LEAK (MINUTOWY) =================
  - choose:
      - conditions: >
          {{ water_hour_l > avg_hourly + leak_threshold_lph and alert_allowed }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ '🚨 WYCIEK WODY' if language == 'PL' else '🚨 WATER LEAK' }}"
            message: >
              {{ water_hour_l }} L/h >
              {{ avg_hourly }} + {{ leak_threshold_lph }} L

          - choose:
              - conditions: "{{ notify_device_secondary | length > 0 }}"
                sequence:
                  - service: notify.mobile_app_{{ notify_device_secondary }}
                    data:
                      title: "{{ '🚨 WYCIEK WODY' if language == 'PL' else '🚨 WATER LEAK' }}"
                      message: >
                        {{ water_hour_l }} L/h >
                        {{ avg_hourly }} + {{ leak_threshold_lph }} L

          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.waterguard_last_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ================= ZERO-HOUR STREAK =================
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.waterguard_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
            default:
              - service: input_number.set_value
                target:
                  entity_id: input_number.waterguard_zero_hour_streak
                data:
                  value: 0

  # ================= EMA UPDATE (14-DNIOWA) =================
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: "input_number.waterguard_hour_{{ current_hour }}"
            data:
              value: >
                {% set alpha = 2 / (14 + 1) %}
                {% set ema_old = avg_hourly %}
                {% set current = water_hour_l %}
                {% if ema_old == 0 %}
                  {{ current | round(1) }}
                {% else %}
                  {{ (alpha * current + (1 - alpha) * ema_old) | round(1) }}
                {% endif %}

