blueprint:
  name: Water Guardian – monitor wycieków i zalania (stabilny)
  description: >
    Monitoruje zużycie wody, wykrywa wycieki oraz reaguje na czujniki zalania.
    Obsługuje opcjonalny zmiękczacz wody z regeneracją.
    Powiadomienia wysyłane przez urządzenia mobilne (mobile_app).
  domain: automation

  input:
    water_sensor:
      name: Sensor zużycia wody
      selector:
        entity:
          domain: sensor

    water_unit:
      name: Jednostka sensora
      default: m3
      selector:
        select:
          options:
            - label: "m³"
              value: m3
            - label: "litry"
              value: l

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 10
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie powiadomień
      description: Wybierz urządzenie mobilne (aplikacja HA)
      selector:
        device:
          integration: mobile_app

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_avg_liters:
      name: Średni pobór wody przy regeneracji (L)
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 1
          unit_of_measurement: "L"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/5"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_sensor: !input water_sensor
  water_unit: !input water_unit
  leak_threshold_lph: !input leak_threshold_lph

  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_avg_liters: !input soften_avg_liters

  water_raw: "{{ states(water_sensor) | float(0) }}"
  water_lph: >
    {% if water_unit == 'm3' %}
      {{ water_raw * 1000 }}
    {% else %}
      {{ water_raw }}
    {% endif %}

  now_time: "{{ now().strftime('%H:%M') }}"
  soften_min: "{{ soften_avg_liters - 25 }}"
  soften_max: "{{ soften_avg_liters + 25 }}"
  in_soften_window: >
    {{ soften_enabled and soften_start <= now_time <= soften_end }}

action:
  - choose:

      # Czujniki zalania
      - conditions:
          - condition: trigger
            id: state
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie przez czujnik {{ trigger.entity_id }}"

      # Podejrzenie wycieku wody
      - conditions:
          - condition: template
            value_template: "{{ water_lph >= leak_threshold_lph }}"
        sequence:
          - choose:

              # Prawdopodobna regeneracja zmiękczacza
              - conditions:
                  - condition: template
                    value_template: "{{ in_soften_window and soften_min <= water_lph <= soften_max }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚿 Pobór wody – możliwa regeneracja"
                    message: >
                      Wykryto pobór {{ water_lph | round(1) }} L/h.
                      Zakres odpowiada regeneracji zmiękczacza.

            default:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🚨 PODEJRZENIE WYCIEKU WODY"
                message: >
                  Stały pobór {{ water_lph | round(1) }} L/h
                  przekracza próg {{ leak_threshold_lph }} L/h.

