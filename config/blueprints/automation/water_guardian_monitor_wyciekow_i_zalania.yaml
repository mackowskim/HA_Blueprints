blueprint:
  name: Water Guardian – inteligentny monitoring wycieków (15-min średnia)
  description: >
    Monitoruje chwilowy pobór wody na podstawie 15-minutowej średniej (statistics),
    porównuje z 14-dniową średnią godzinową i wysyła powiadomienia.
    Obsługuje opcjonalne czujniki zalania i zmiękczacz wody.
  domain: automation

  input:
    water_sensor:
      name: Sensor przepływu (L/min, statistics 15-min)
      description: Sensor, który mierzy średni pobór wody w L/min
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      description: Lista czujników zalania
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie mobilne do powiadomień
      description: Wybierz urządzenie z integracji mobile_app
      selector:
        device:
          integration: mobile_app
          multiple: false

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_avg_liters:
      name: Średni pobór wody przy regeneracji (L)
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 1
          unit_of_measurement: "L"

mode: single

trigger:
  - platform: template
    value_template: "{{ now().second == 0 }}"

variables:
  water_sensor_entity: !input water_sensor
  leak_threshold: !input leak_threshold_lph
  flood_sensors_list: !input flood_sensors
  notify_device_id: !input notify_device
  soften_enabled_var: !input soften_enabled
  soften_start_var: !input soften_start
  soften_end_var: !input soften_end
  soften_avg_liters_var: !input soften_avg_liters
  current_hour: "{{ now().hour }}"
  water_l_min_mean: "{{ state_attr(water_sensor_entity, 'mean') | float(0) }}"
  water_lph: "{{ water_l_min_mean * 60 }}"
  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  now_time: "{{ now().strftime('%H:%M') }}"
  soften_min: "{{ soften_avg_liters_var - 25 }}"
  soften_max: "{{ soften_avg_liters_var + 25 }}"
  in_soften_window: >
    {{ soften_enabled_var and soften_start_var <= now_time <= soften_end_var }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ flood_sensors_list | length > 0 and trigger.entity_id in flood_sensors_list }}"
        sequence:
          - device_id: "{{ notify_device_id }}"
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: "Wykryto zalanie przez czujnik {{ trigger.entity_id }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ water_lph > avg_hourly + leak_threshold }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ in_soften_window and soften_min <= water_lph <= soften_max }}"
                sequence:
                  - device_id: "{{ notify_device_id }}"
                    domain: mobile_app
                    type: notify
                    title: "🚿 Pobór wody – możliwa regeneracja"
                    message: >
                      Wykryto pobór {{ water_lph | round(1) }} L/h.
                      Zakres odpowiada regeneracji zmiękczacza.
            default:
              - device_id: "{{ notify_device_id }}"
                domain: mobile_app
                type: notify
                title: "🚨 PODEJRZENIE WYCIEKU WODY"
                message: >
                  Chwilowy pobór {{ water_lph | round(1) }} L/h
                  przekracza średnią godzinową {{ avg_hourly | round(1) }} L/h.

  - service: input_number.set_value
    target:
      entity_id: "input_number.zuzycie_wody_stat_{{ current_hour }}"
    data:
      value: >
        {{ ((avg_hourly * 13) + water_lph) / 14 }}

