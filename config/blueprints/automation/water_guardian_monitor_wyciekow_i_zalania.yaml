blueprint:
  name: Water Guardian – Leak & Flood Detector (v0.95)
  description: >
    Detect leaks and floods with Water Guardian LIW-01.
    Minutely leak detection with cooldown, hourly EMA, optional water softener detection.
    Notifications and TTS in Polish or English.
  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – hourly water consumption
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Leak threshold (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Flood sensors (optional)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Flood automation (optional)
      default: []
      selector:
        action: {}

    notify_device:
      name: Primary notification device
      selector:
        device:
          integration: mobile_app

    notify_device_secondary:
      name: Secondary device (optional)
      default: ""
      selector:
        device:
          integration: mobile_app

    media_players:
      name: Media Player TTS (optional)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    soften_enabled:
      name: Water softener
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Softener start time
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Softener end time
      default: "04:00"
      selector:
        time: {}

    soften_min_lph:
      name: Minimum softener consumption (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    soften_max_lph:
      name: Maximum softener consumption (L/h)
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    leak_cooldown_minutes:
      name: Leak alert cooldown (minutes)
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: "min"

    language:
      name: Language for notifications
      default: "PL"
      selector:
        select:
          options:
            - PL
            - EN

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  flood_action: !input flood_action
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_min_lph: !input soften_min_lph
  soften_max_lph: !input soften_max_lph
  leak_cooldown_minutes: !input leak_cooldown_minutes
  lang: !input language

  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"
  in_soften_window: "{{ soften_enabled and soften_start <= now_time <= soften_end }}"

  water_hour_l: >-
    {% set raw = states('sensor.waterguard_hourly_water') | float(0) %}
    {% set unit = state_attr('sensor.waterguard_hourly_water','unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw*1000)|round(1) }}
    {% else %}
      {{ raw|round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.waterguard_hour_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.waterguard_zero_hour_streak') | int(0) }}"
  last_alert: "{{ states('input_datetime.water_leak_last_alert') }}"
  alert_allowed: >-
    {% if last_alert in ['unknown','unavailable',''] %}
      true
    {% else %}
      {{ (now().timestamp() - strptime(last_alert, '%Y-%m-%d %H:%M:%S').timestamp()) > leak_cooldown_minutes*60 }}
    {% endif %}

  # Messages depending on language
  msg_flood_title: "{{ '💧 ZALANIE!' if lang=='PL' else '💧 FLOOD!' }}"
  msg_flood_body: >-
    {% if lang=='PL' %}
      Wykryto zalanie: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
    {% else %}
      Flood detected: {{ state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }}
    {% endif %}

  msg_leak_title: "{{ '🚨 WYCIEK WODY' if lang=='PL' else '🚨 WATER LEAK' }}"
  msg_leak_body: >-
    {% if lang=='PL' %}
      Zużycie {{ water_hour_l | round(1) }} L/h przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L
    {% else %}
      Consumption {{ water_hour_l | round(1) }} L/h exceeds average {{ avg_hourly | round(1) }} + threshold {{ leak_threshold_lph }} L
    {% endif %}

action:

  # ===== FLOOD =====
  - choose:
      - conditions: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    entity_id: !input flood_action

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ msg_flood_title }}"
            message: "{{ msg_flood_body }}"

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "{{ msg_flood_title }}"
                    message: "{{ msg_flood_body }}"

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{{ 'pl' if lang=='PL' else 'en' }}"
                            message: "{{ msg_flood_body }}"

          - stop: "Flood – stop automation"

  # ===== MINUTE LEAK DETECTION (COOLDOWN) =====
  - choose:
      - conditions: >
          {{ not in_soften_window
             and water_hour_l > avg_hourly + leak_threshold_lph
             and alert_allowed }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ msg_leak_title }}"
            message: "{{ msg_leak_body }}"

          - choose:
              - conditions: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "{{ msg_leak_title }}"
                    message: "{{ msg_leak_body }}"

          - choose:
              - conditions: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "{{ 'pl' if lang=='PL' else 'en' }}"
                            message: "{{ msg_leak_body }}"

          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.water_leak_last_alert
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ===== ZERO HOURS STREAK – 3x =====
  - choose:
      - conditions: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.waterguard_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - conditions: "{{ not (avg_hourly == 0 and water_hour_l > 0) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.waterguard_zero_hour_streak
                    data:
                      value: 0

          - choose:
              - conditions: "{{ zero_hour_streak >= 3 }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ '🚨 WYCIEK – nietypowe godziny' if lang=='PL' else '🚨 LEAK – unusual hours' }}"
                    message: >-
                      {% if lang=='PL' %}
                        Pobór w godzinach historycznie zerowych przez 3 kolejne godziny
                      {% else %}
                        Consumption in historically zero hours for 3 consecutive hours
                      {% endif %}

