blueprint:
  name: water_guardian_monitor_wyciekow_i_zalania
  description: Monitor wycieków wody na podstawie przepływu i czujników zalania
  domain: automation

  input:
    water_flow_sensor:
      name: Czujnik przepływu (L/min)
      selector:
        entity:
          domain: sensor

    hourly_average_sensor:
      name: Średnia godzinowa (L/h)
      selector:
        entity:
          domain: sensor

    leak_threshold:
      name: Próg nadwyżki (L/h)
      default: 30
      selector:
        number:
          min: 5
          max: 500
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    soften_start_hour:
      name: Start regeneracji zmiękczacza (godzina)
      default: 2
      selector:
        number:
          min: 0
          max: 23

    soften_end_hour:
      name: Koniec regeneracji zmiękczacza (godzina)
      default: 4
      selector:
        number:
          min: 0
          max: 23

    soften_min_lph:
      name: Min pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 200

    soften_max_lph:
      name: Max pobór zmiękczacza (L/h)
      default: 120
      selector:
        number:
          min: 0
          max: 300

    notify_device:
      name: Telefon (Home Assistant App)
      selector:
        device:
          integration: mobile_app
          multiple: false

trigger:
  - platform: time_pattern
    minutes: "/1"

  - platform: state
    entity_id: !input flood_sensors
    to: "on"

mode: single

action:
  - variables:
      water_lph: "{{ states(!input water_flow_sensor) | float(0) * 60 }}"
      avg_lph: "{{ states(!input hourly_average_sensor) | float(0) }}"
      hour_now: "{{ now().hour }}"
      soften_active: >
        {{ hour_now >= (!input soften_start_hour)
           and hour_now < (!input soften_end_hour) }}

  - choose:
      # 💧 ZALANIE
      - conditions:
          - condition: trigger
            id: flood
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 ZALANIE"
            message: "Wykryto wodę przez czujnik zalania!"

      # 🟡 ZMIĘKCZACZ
      - conditions:
          - condition: template
            value_template: >
              {{ soften_active
                 and water_lph >= (!input soften_min_lph)
                 and water_lph <= (!input soften_max_lph) }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "ℹ️ Regeneracja zmiękczacza"
            message: >
              Pobór {{ water_lph | round(1) }} L/h
              odpowiada pracy zmiękczacza.

      # 🚨 PODEJRZENIE WYCIEKU
      - conditions:
          - condition: template
            value_template: >
              {{ water_lph > avg_lph + (!input leak_threshold) }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 PODEJRZENIE WYCIEKU WODY"
            message: >
              Pobór {{ water_lph | round(1) }} L/h
              przekracza średnią {{ avg_lph | round(1) }} L/h

    default: []

