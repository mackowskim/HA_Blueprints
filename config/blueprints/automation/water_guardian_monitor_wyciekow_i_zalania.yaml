blueprint:
  name: Water Guardian – inteligentny monitoring wycieków (15-min mean)
  description: >
    Monitoring wycieków wody z wykorzystaniem średniej 15-minutowej.
    Oddzielona logika statystyk i detekcji. Obsługa zmiękczacza i czujników zalania.
    Dwutorowa detekcja: minutowa dla normalnego poboru, godzinowa w trakcie zmiękczacza.
  domain: automation

  input:
    water_sensor:
      name: Sensor przepływu (L/min)
      selector:
        entity:
          domain: sensor

    flood_sensors:
      name: Czujniki zalania
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    notify_device:
      name: Urządzenie do powiadomień
      selector:
        device:
          integration: mobile_app

    leak_threshold_lph:
      name: Próg wycieku (L/h ponad normę)
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 10
          unit_of_measurement: L/h

    soften_min_lph:
      name: Zmiękczacz – MIN zużycie godzinowe
      default: 40
      selector:
        number:
          min: 0
          max: 500
          step: 10
          unit_of_measurement: L/h

    soften_max_lph:
      name: Zmiękczacz – MAX zużycie godzinowe
      default: 100
      selector:
        number:
          min: 0
          max: 500
          step: 10
          unit_of_measurement: L/h

    softener_active:
      name: Regeneracja zmiękczacza (boolean)
      selector:
        entity:
          domain: input_boolean

trigger:
  # minutowy trigger
  - platform: time_pattern
    minutes: "/1"

  # trigger z czujników zalania
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_sensor: !input water_sensor
  flood_sensors: !input flood_sensors
  softener_active: !input softener_active

  soften_min_lph: !input soften_min_lph
  soften_max_lph: !input soften_max_lph
  leak_threshold_lph: !input leak_threshold_lph

  # pobór w L/min i przeliczony na L/h
  water_l_min: "{{ states(water_sensor) | float(0) }}"
  water_lph: "{{ water_l_min * 60 }}"

  # średnia 15-minutowa w L/h
  water_lph_15min: "{{ states('sensor.water_flow_l_min_15min') | float(0) * 60 }}"

  # sprawdzenie czy trwa regeneracja
  in_soften_window: "{{ is_state(softener_active, 'on') }}"

action:
  - choose:

      # =========================
      # CZUJNIKI ZALANIA
      # =========================
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: >
              Wykryto zalanie: {{
                state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id
              }}
          - stop: "Zalanie – przerwanie dalszych akcji"

      # =========================
      # DETEKCJA GODZINOWA – zmiękczacz
      # =========================
      - conditions:
          - condition: template
            value_template: >
              {{ in_soften_window
                 and (water_lph_15min < soften_min_lph
                      or water_lph_15min > soften_max_lph) }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 ANOMALIA – ZMIĘKCZACZ"
            message: >
              Zużycie {{ water_lph_15min | round(1) }} L/h
              poza zakresem {{ soften_min_lph }}–{{ soften_max_lph }} L/h.

      # =========================
      # DETEKCJA MINUTOWA – normalny pobór
      # =========================
      - conditions:
          - condition: template
            value_template: >
              {{ not in_soften_window and water_lph_15min > leak_threshold_lph }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 PODEJRZENIE WYCIEKU"
            message: >
              Zużycie {{ water_lph_15min | round(1) }} L/h
              przekracza dopuszczalny próg {{ leak_threshold_lph }} L/h.

mode: single

