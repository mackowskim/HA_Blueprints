blueprint:
  name: Water Guardian – detektor wycieków i zalania (v2)
  description: >
    Detekcja wycieków oparta o:
    - chwilowy przepływ (15-min mean)
    - zużycie godzinowe z utility_meter
    Alarmy tylko po 3 kolejnych naruszeniach.
    EMA 14-dniowa liczona z realnych danych godzinowych.
  domain: automation

  input:
    flow_sensor:
      name: Sensor przepływu (15-min mean, L/min)
      selector:
        entity:
          domain: sensor

    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Dodatkowy próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    notify_device:
      name: Urządzenie do powiadomień
      selector:
        device:
          integration: mobile_app

    leak_action:
      name: Automatyzacja przy wycieku (opcjonalnie)
      default: []
      selector:
        action: {}

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"

variables:
  flow_sensor: !input flow_sensor
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  notify_device: !input notify_device
  leak_action: !input leak_action

  current_hour: "{{ now().hour }}"
  minute: "{{ now().minute }}"

  # ===== CHWILOWY PRZEPŁYW =====
  flow_l_min: "{{ states(flow_sensor) | float(0) }}"
  flow_lph: "{{ flow_l_min * 60 }}"

  # ===== ZUŻYCIE GODZINOWE =====
  raw_hour_value: "{{ states(water_hour_meter) | float(0) }}"
  unit: "{{ state_attr(water_hour_meter, 'unit_of_measurement') }}"
  hour_liters: >
    {% if unit in ['m³', 'm3'] %}
      {{ raw_hour_value * 1000 }}
    {% else %}
      {{ raw_hour_value }}
    {% endif %}

  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"

  leak_streak: "{{ states('input_number.water_leak_streak') | int(0) }}"
  zero_hour_streak: "{{ states('input_number.water_zero_hour_streak') | int(0) }}"

action:

  # =========================================================
  # 1️⃣ NORMALNA DETEKCJA WYCIEKU (MINUTOWA)
  # =========================================================
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ avg_hourly > 0 and flow_lph > avg_hourly + leak_threshold_lph }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: "{{ leak_streak + 1 }}"
      - conditions:
          - condition: template
            value_template: "{{ avg_hourly > 0 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  # 🚨 ALARM PO 3 RAZACH
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ leak_streak >= 3 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ leak_action != [] }}"
                sequence:
                  - sequence: !input leak_action
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: >
              Stały pobór {{ flow_lph | round(1) }} L/h
              przekracza średnią {{ avg_hourly | round(1) }} L/h
          - service: input_number.set_value
            target:
              entity_id: input_number.water_leak_streak
            data:
              value: 0

  # =========================================================
  # 2️⃣ GODZINY HISTORYCZNIE ZEROWE (59. MINUTA)
  # =========================================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ avg_hourly == 0 and hour_liters > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - default:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: 0

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ zero_hour_streak >= 3 }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK – nietypowe godziny"
                    message: >
                      Pobór w godzinach historycznie zerowych
                      przez 3 kolejne godziny.

