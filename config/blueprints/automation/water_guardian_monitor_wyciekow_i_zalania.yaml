blueprint:
  name: Water Guardian – detektor wycieków i zalania (v0.91)
  description: >
    Detekcja wycieków i zalania z obsługą zmiękczacza, EMA 14-dniową,
    powiadomienia mobilne i TTS na media_player.  
    Minutowa detekcja wycieku działa natychmiast na podstawie utility_meter.  
    3x streak pozostaje tylko dla godzin historycznie zerowych.

  domain: automation

  input:
    water_hour_meter:
      name: Utility meter – zużycie godzinowe
      selector:
        entity:
          domain: sensor

    leak_threshold_lph:
      name: Próg wycieku (L/h)
      default: 25
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: "L/h"

    flood_sensors:
      name: Czujniki zalania (opcjonalne)
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    flood_action:
      name: Automatyzacja przy zalaniu (opcjonalnie)
      default: []
      selector:
        action: {}

    notify_device:
      name: Urządzenie do powiadomień (główne)
      selector:
        device:
          integration: mobile_app
          multiple: false

    notify_device_secondary:
      name: Urządzenie do powiadomień (opcjonalne)
      default: ""
      selector:
        device:
          integration: mobile_app
          multiple: false

    media_players:
      name: Media Player TTS (opcjonalnie)
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true

    soften_enabled:
      name: Zmiękczacz wody
      default: false
      selector:
        boolean: {}

    soften_start:
      name: Godzina startu regeneracji
      default: "02:00"
      selector:
        time: {}

    soften_end:
      name: Godzina końca regeneracji
      default: "04:00"
      selector:
        time: {}

    soften_min_lph:
      name: Minimalny pobór zmiękczacza (L/h)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

    soften_max_lph:
      name: Maksymalny pobór zmiękczacza (L/h)
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "L/h"

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input flood_sensors
    to: "on"

variables:
  water_hour_meter: !input water_hour_meter
  leak_threshold_lph: !input leak_threshold_lph
  flood_sensors: !input flood_sensors
  flood_action: !input flood_action
  notify_device: !input notify_device
  notify_device_secondary: !input notify_device_secondary
  media_players: !input media_players
  soften_enabled: !input soften_enabled
  soften_start: !input soften_start
  soften_end: !input soften_end
  soften_min_lph: !input soften_min_lph
  soften_max_lph: !input soften_max_lph

  now_time: "{{ now().strftime('%H:%M') }}"
  minute: "{{ now().minute }}"
  current_hour: "{{ now().hour }}"
  in_soften_window: "{{ soften_enabled and soften_start <= now_time <= soften_end }}"

  water_hour_l: >-
    {% set raw = states(water_hour_meter) | float(0) %}
    {% set unit = state_attr(water_hour_meter,'unit_of_measurement') | lower %}
    {% if unit in ['m³','m3','m^3'] %}
      {{ (raw*1000)|round(1) }}
    {% else %}
      {{ raw|round(1) }}
    {% endif %}

  avg_hourly: "{{ states('input_number.zuzycie_wody_stat_' ~ current_hour) | float(0) }}"
  zero_hour_streak: "{{ states('input_number.water_zero_hour_streak') | int(0) }}"

action:

  # ===== ZALANIE =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in flood_sensors }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ flood_action | length > 0 }}"
                sequence:
                  - service: automation.trigger
                    data: {}
                    entity_id: !input flood_action
          # powiadomienie główne
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 ZALANIE!"
            message: >
              Wykryto zalanie: {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
          # powiadomienie drugie (opcjonalne)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "💧 ZALANIE!"
                    message: >
                      Wykryto zalanie: {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
          # TTS (opcjonalnie)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "💧 ZALANIE! Wykryto zalanie: {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}"
          - stop: "Zalanie – przerwanie dalszych akcji"

  # ===== MINUTOWA DETEKCJA WYCIEKU =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not in_soften_window and water_hour_l > avg_hourly + leak_threshold_lph }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🚨 WYCIEK WODY"
            message: "Suma poboru ostatniej godziny {{ water_hour_l | round(1) }} L przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_device_secondary != '' }}"
                sequence:
                  - device_id: !input notify_device_secondary
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK WODY"
                    message: "Suma poboru ostatniej godziny {{ water_hour_l | round(1) }} L przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ media_players | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ media_players }}"
                      sequence:
                        - service: tts.google_say
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            language: "pl"
                            message: "🚨 WYCIEK WODY! Suma poboru ostatniej godziny {{ water_hour_l | round(1) }} L przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L"

  # ===== GODZINOWA DETEKCJA ZMIĘKCZACZA =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_soften_window and minute == 59 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ soften_min_lph <= water_hour_l <= soften_max_lph }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "💧 Zmiękczacz w pracy"
                    message: "Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ water_hour_l > avg_hourly + leak_threshold_lph }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 PODEJRZENIE WYCIEKU (godzinowe)"
                    message: "Suma poboru w ostatniej godzinie: {{ water_hour_l | round(1) }} L przekracza średnią {{ avg_hourly | round(1) }} + próg {{ leak_threshold_lph }} L"

  # ===== GODZINY HISTORYCZNIE ZEROWE – 3x z rzędu =====
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ minute == 59 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ avg_hourly == 0 and water_hour_l > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: "{{ zero_hour_streak + 1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ not (avg_hourly == 0 and water_hour_l > 0) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.water_zero_hour_streak
                    data:
                      value: 0
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ zero_hour_streak >= 3 }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🚨 WYCIEK – nietypowe godziny"
                    message: "Pobór w godzinach historycznie zerowych przez 3 kolejne godziny."

